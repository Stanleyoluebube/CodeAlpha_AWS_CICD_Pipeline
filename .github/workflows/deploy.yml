name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      run: |
        docker build -t stanley-cicd-app .

    - name: Tag Image
      run: |
        docker tag stanley-cicd-app:latest \
        ${{ steps.login-ecr.outputs.registry }}/stanley-cicd-app:latest

    - name: Push Image
      run: |
        docker push \
        ${{ steps.login-ecr.outputs.registry }}/stanley-cicd-app:latest